<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HarmonyOS 小程序容器 · 面试演示</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#1c2b42;background:#eef2f8}*{box-sizing:border-box}body{margin:0}header{padding:30px max(5vw,24px);background:#101827;color:#fff}header small{letter-spacing:2px;color:#a6bfdf}h1{font-size:30px;margin:12px 0}header p{color:#c4d1e4;max-width:900px;line-height:1.8;margin:0}main{max-width:1480px;margin:28px auto;padding:0 24px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}button,.link{font:inherit;border:1px solid #d3dceb;border-radius:9px;background:#fff;color:#223b61;padding:12px 18px;cursor:pointer;text-decoration:none}button[aria-selected=true]{background:#1559d6;color:#fff;border-color:#1559d6}.bar .link{margin-left:auto}section{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:22px}video{display:block;width:100%;background:#101827;border-radius:14px;aspect-ratio:16/9}.panel{padding:22px;background:#fff;border-radius:14px;box-shadow:0 4px 20px #25375208}.panel h2{font-size:21px;margin:0 0 14px}.muted{color:#63748c;font-size:14px;line-height:1.8}.live{font-size:16px;line-height:1.95;white-space:pre-line;min-height:145px}.chapter{display:block;text-align:left;width:100%;margin:8px 0;border:0;background:#f1f5fb;padding:12px}.chapter.active{background:#e1ecff;color:#174fa7;box-shadow:inset 3px 0 #1559d6}.chapter time{font-variant-numeric:tabular-nums;display:inline-block;min-width:52px;font-size:13px;color:#657b9d}.under{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}.under a{color:#1559d6;font-size:14px}footer{margin:25px 0;color:#687991;font-size:13px;line-height:1.9}#boundaries{padding-left:20px;font-size:14px;color:#5f7089;line-height:1.9}#status{color:#59718f;font-size:14px}#count{color:#60718a;font-size:14px}#error{display:none;padding:22px;background:#fff3dd;color:#77501b;border-radius:10px;margin-top:12px}@media(max-width:950px){section{grid-template-columns:1fr}.live{min-height:0}h1{font-size:25px}.bar .link{margin-left:0}}:focus-visible{outline:3px solid #55a4ff;outline-offset:3px}
</style>
<header><small>HARMONYOS · HAR · ARKWEB</small><h1>真实小程序，完整业务流程</h1><p>LINE 天气查询与偏好恢复 / VK 参数计算与业务导航。配合真机画面讲解容器接入、导航退出与恢复，区分个人贡献和第三方业务。</p></header>
<main>
 <div class="bar" role="tablist" aria-label="选择平台"><button id="line" role="tab" aria-selected="true">LINE · 天气业务</button><button id="vk" role="tab" aria-selected="false">VK · 计算业务</button><span id="count"></span><a class="link" href="interview-script.md" download>下载完整讲解稿</a></div>
 <section>
  <div><video id="video" controls playsinline preload="metadata"></video><div id="error">无法读取视频。请完整解压展示包，确认 videos 文件夹与本页面位于同一目录。</div><div class="under"><a id="download" download>下载此段 MP4</a><a id="srt" download>下载中文字幕 SRT</a><a href="README.md">播放与演示说明</a></div><p class="muted" id="status">正在读取素材清单…</p><div class="panel"><h2 id="step">当前讲解</h2><div class="live" id="narration"></div></div></div>
  <aside class="panel"><h2>流程章节</h2><div id="chapters"></div><h2 style="margin-top:26px">展示边界</h2><ul id="boundaries"></ul></aside>
 </section>
 <footer>视频为静音字幕版，可按右侧章节跳转并口述讲稿。录屏来自真机；等待的剪辑处理以素材清单为准。第三方业务页面、算法和数据不归为个人原创研发。</footer>
</main>
<script src="chapters.js"></script>
<script>
const video=document.getElementById('video');let current;const stamp=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function select(id){current=window.SHOWCASE?.videos.find(v=>v.id===id);if(!current){document.getElementById('status').textContent='素材尚未生成，请完成真机录制及视频构建。';return;}for(const key of ['line','vk'])document.getElementById(key).setAttribute('aria-selected',String(key===id));video.src=current.file;video.poster=current.poster;document.getElementById('error').style.display='none';document.getElementById('download').href=current.file;document.getElementById('srt').href=`subtitles/${id}.srt`;document.getElementById('count').textContent=`${stamp(current.duration)} · 静音字幕版`;document.getElementById('status').textContent=`录制日期 ${window.SHOWCASE.recordedOn} · H.264 / 1080p / 30 fps · ${(current.size/1048576).toFixed(1)} MB`;const list=document.getElementById('chapters');list.replaceChildren();current.chapters.forEach((chapter,i)=>{const b=document.createElement('button');b.className='chapter';const t=document.createElement('time');t.textContent=stamp(chapter.start);b.append(t,document.createTextNode(chapter.title));b.onclick=()=>{video.currentTime=chapter.start;update();};b.dataset.index=i;list.append(b);});const bounds=document.getElementById('boundaries');bounds.replaceChildren();for(const text of current.boundaries){const li=document.createElement('li');li.textContent=text;bounds.append(li);}update();}
function update(){if(!current)return;let i=current.chapters.findIndex(c=>video.currentTime>=c.start&&video.currentTime<c.end);if(i<0)i=current.chapters.length-1;const c=current.chapters[i];document.getElementById('step').textContent=c.title;document.getElementById('narration').textContent=c.narration.replace(/\n/g,'')+(c.note?'\n\n'+c.note.replace(/\n/g,''): '');for(const b of document.querySelectorAll('.chapter'))b.classList.toggle('active',Number(b.dataset.index)===i);}
video.addEventListener('timeupdate',update);video.addEventListener('error',()=>document.getElementById('error').style.display='block');for(const id of ['line','vk'])document.getElementById(id).onclick=()=>select(id);select('line');
</script>
</html>
